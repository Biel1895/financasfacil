<dialog id="confirmDialog" class="dialog confirm-dialog" aria-labelledby="confirmTitle">
  <div class="dialog-heading">
    <h2 id="confirmTitle">Confirmar ação</h2>
    <button class="icon-button" data-close aria-label="Fechar">
      <span data-icon="x"></span>
    </button>
  </div>
  <p id="confirmMessage" class="muted"></p>
  <div class="dialog-actions">
    <button id="confirmCancel" class="button quiet">Cancelar</button
    ><button id="confirmAccept" class="button primary">Confirmar</button>
  </div>
</dialog>
