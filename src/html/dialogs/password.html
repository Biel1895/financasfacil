<dialog id="changePasswordDialog" class="dialog" aria-labelledby="changePasswordTitle">
  <div class="dialog-heading">
    <div>
      <span class="eyebrow">MINHA CONTA</span>
      <h2 id="changePasswordTitle">Alterar senha</h2>
    </div>
    <button class="icon-button" type="button" data-close aria-label="Fechar">
      <span data-icon="x"></span>
    </button>
  </div>
  <form id="changePasswordForm">
    <div id="changePasswordAlert" class="inline-alert danger" role="alert" hidden></div>
    <label id="currentPasswordGroup"
      >Senha atual<input
        id="currentPassword"
        type="password"
        autocomplete="current-password"
        maxlength="128"
    /></label>
    <label
      >Nova senha<input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        maxlength="128"
        required
    /></label>
    <label
      >Repita a nova senha<input
        id="newPasswordAgain"
        type="password"
        autocomplete="new-password"
        minlength="8"
        maxlength="128"
        required
    /></label>
    <div class="dialog-actions">
      <button class="button secondary" type="button" data-close>Cancelar</button>
      <button id="btnSavePassword" class="button primary" type="submit">Salvar senha</button>
    </div>
  </form>
</dialog>
