<div class="period-toolbar">
  <div class="month-picker" aria-label="Selecionar mês">
    <button id="btnPrevMonth" class="icon-button" aria-label="Mês anterior">
      <span data-icon="chevron-left"></span></button
    ><span id="currentMonthLabel" aria-live="polite"></span
    ><button id="btnNextMonth" class="icon-button" aria-label="Próximo mês">
      <span data-icon="chevron-right"></span>
    </button>
  </div>
  <button id="btnCurrentMonth" class="text-button">Voltar para este mês</button
  ><span id="periodHint" class="period-hint">Movimentações realizadas</span>
</div>
