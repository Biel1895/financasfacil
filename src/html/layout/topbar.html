<header class="topbar">
  <a class="brand mobile-brand" href="#inicio"
    ><span class="brand-mark" data-icon="wallet"></span><span>FinançasFácil</span></a
  >
  <button
    id="dbStatusBadge"
    class="sync-status"
    data-action="settings"
    title="Ver salvamento e backup"
  >
    <span class="status-dot"></span><span id="syncStatusText">Salvo neste aparelho</span>
  </button>
  <div class="topbar-actions">
    <button
      id="privacyButton"
      class="icon-button"
      aria-label="Ocultar valores"
      aria-pressed="false"
    >
      <span data-icon="eye"></span></button
    ><button id="themeButton" class="icon-button" aria-label="Alternar tema">
      <span data-icon="sun"></span></button
    ><button class="profile-button" data-action="settings" aria-label="Abrir dados da conta">
      <span id="userAvatar">F</span><span id="loggedUserDisplay"></span>
    </button>
  </div>
</header>
