<p id="installGuide" class="install-guide" data-install-guide hidden>
  No Safari, abra o menu <strong>Compartilhar</strong>, toque em
  <strong>Adicionar à Tela de Início</strong> e ative <strong>Abrir como App da Web</strong> se a
  opção aparecer. Depois, toque em <strong>Adicionar</strong>.
</p>
