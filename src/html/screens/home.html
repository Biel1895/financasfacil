    <div>
      <h2 id="monthlyBalanceTitle">Saldo do mês</h2>
      <p id="monthlyBalancePeriod" class="muted"></p>
    </div>
    <div class="monthly-balance-amount">
      <strong id="monthlyBalanceValue" class="money" aria-live="polite"></strong>
      <p id="monthlyBalanceFormula" class="muted"></p>

  <div class="home-grid">

          <span class="eyebrow">OLHE PARA FRENTE</span>

        <a class="text-button" href="#contas">Ver todas <span data-icon="arrow-right"></span></a>

      <div id="homeBills"></div>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <span class="eyebrow">SEU DIA A DIA</span>
          <h2>Últimos lançamentos</h2>
        </div>
        <a class="text-button" href="#lancamentos"
          >Ver todos <span data-icon="arrow-right"></span
        ></a>
      </div>
      <div id="homeTransactions"></div>
    </section>

  <div id="homeInsight" class="insight-banner"></div>
